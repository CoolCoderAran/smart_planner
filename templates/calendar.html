<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='planner.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Planner Logo">
            </a>
            <ul class="nav-links">
                <li><a href="/planner">Planner</a></li>
                <li><a href="/calendar" class="active">Calendar</a></li>
            </ul>
        </div>
        <div class="nav-right">
            {% if session.get("user") %}
            <div class="account-menu">
                <button class="account-btn">
                    <span class="account-avatar">{{ session["user"][0].upper() }}</span>
                    <span class="account-name">{{ session["user"] }}</span>
                    ▾
                </button>
                <div class="account-dropdown">
                    <a href="/dashboard">Dashboard</a>
                    <a href="/logout">Logout</a>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="main-content">
        <!-- CALENDAR HEADER & NAVIGATION -->
        <header class="calendar-header">
            <div class="calendar-nav-controls">
                <button id="prevMonthBtn" class="nav-btn">&larr; Previous</button>
                <h2 id="currentMonthYearDisplay"></h2>
                <button id="nextMonthBtn" class="nav-btn">Next &rarr;</button>
                <button id="todayBtn" class="today-btn">Today</button>
            </div>
            
            <div class="calendar-view-picker">
                <button class="view-btn active" data-view="month">Month</button>
                <button class="view-btn" data-view="week">Week</button>
            </div>
        </header>

        <!-- CALENDAR GRID CONTAINER -->
        <main class="calendar-container">
            <div class="calendar-weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- Days rendered dynamically via calendar.js -->
            </div>
        </main>
    </div>

    <!-- CALENDAR TASK DETAILS MODAL -->
    <div id="calendarTaskModal" class="modal-overlay">
      <div class="modal-content">
        <button class="modal-close" onclick="closeCalendarModal()">&times;</button>
        <h3 id="calModalTitle">Task Details</h3>
        <p><strong>Subject:</strong> <span id="calModalSubject"></span></p>
        <p><strong>Due Date:</strong> <span id="calModalDueDate"></span></p>
        <p><strong>Priority:</strong> <span id="calModalPriority"></span></p>
        <p><strong>Est. Time:</strong> <span id="calModalEst"></span> mins</p>
        <p><strong>Status:</strong> <span id="calModalStatus"></span></p>
        
        <div class="modal-actions">
            <button id="calToggleBtn" class="task-button complete-button">Toggle Complete</button>
            <button id="calEditBtn" class="task-button edit-button">Edit</button>
            <button id="calDeleteBtn" class="task-button delete-button">Delete</button>
        </div>
      </div>
    </div>

    <!-- Safe Variable Embedding -->
    <script>
        const allTasks = {{ (tasks if tasks is defined else []) | tojson | safe }};
        const serverToday = {{ (today_date if today_date is defined else '') | tojson | safe }};
        let currentYear = Number("{{ year | default(2026, true) }}");
        let currentMonth = Number("{{ month | default(1, true) }}"); // 1-indexed (1 = Jan, 12 = Dec)
    </script>
    <script src="{{ url_for('static', filename='planner.js') }}"></script>
    <script src="{{ url_for('static', filename='calendar.js') }}"></script>
</body>
</html>
