<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar • Smart Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
</head>
<body class="calendar-body">

    <!-- NAVBAR -->
    <nav class="navbar glass-card">
        <div class="nav-left">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Planner Logo">
            </a>
            <ul class="nav-links">
                <li><a href="/planner">Planner</a></li>
                <li><a href="/calendar" class="active">Calendar</a></li>
                <li><a href="/study">Focus Mode</a></li>
            </ul>
        </div>

        <div class="nav-right">
            {% if session.get("user") %}
            <div class="account-menu">
                <button class="account-btn glass-btn">
                    <span class="account-avatar">{{ session["user"][0].upper() }}</span>
                    <span class="account-name">{{ session["user"] }}</span>
                </button>
            </div>
            {% else %}
            <a href="/login" class="nav-login">Login</a>
            <a href="/signup" class="nav-signup">Get Started</a>
            {% endif %}
        </div>
    </nav>

    <main class="main-container">
        <!-- HEADER TOOLBAR -->
        <header class="calendar-header glass-card">
            <div class="header-main">
                <div class="month-navigation">
                    <button class="glass-btn" id="prevMonthBtn">&larr;</button>
                    <h1 id="currentMonthYear">Month Year</h1>
                    <button class="glass-btn" id="nextMonthBtn">&rarr;</button>
                    <button class="glass-btn primary" id="todayBtn">Today</button>
                </div>
                
                <div class="calendar-controls">
                    <select id="subjectFilter" class="glass-input">
                        <option value="all">All Subjects</option>
                        {% for subject in subjects %}
                        <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </header>

        <!-- STATS BAR -->
        <section class="metrics-grid">
            <div class="metric-card glass-card">
                <span class="metric-label">Total Hours</span>
                <span class="metric-value" id="totalHours">0h</span>
            </div>
            <div class="metric-card glass-card">
                <span class="metric-label">High Priority</span>
                <span class="metric-value" id="highPriorityCount">0</span>
            </div>
            <div class="metric-card glass-card">
                <span class="metric-label">Peak Workload</span>
                <span class="metric-value" id="peakDay">--</span>
            </div>
            <div class="metric-card glass-card">
                <span class="metric-label">Overdue</span>
                <span class="metric-value danger" id="overdueCount">0</span>
            </div>
        </section>

        <!-- CALENDAR GRID CONTAINER -->
        <section class="calendar-grid-wrapper glass-card">
            <div class="weekdays-header">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- Days injected via Javascript -->
            </div>
        </section>
    </main>

    <!-- TASK DETAILS MODAL -->
    <div id="dayDetailsModal" class="modal-overlay">
        <div class="modal-content glass-card">
            <button class="modal-close" onclick="closeDayModal()">&times;</button>
            <h2 id="modalDateTitle">Scheduled Tasks</h2>
            <div id="modalTaskList" class="modal-task-list">
                <!-- Task items injected via Javascript -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='calendar.js') }}"></script>
</body>
</html>
