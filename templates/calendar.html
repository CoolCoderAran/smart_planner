<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo"><img src="logo.png" alt="Logo" /></a>
      <ul class="nav-links">
        <li><a href="planner.html">Planner</a></li>
        <li><a href="calendar.html" class="active">Calendar</a></li>
      </ul>
    </div>
  </nav>

  <div class="app-wrapper">
    <main class="main-content" style="max-width: 100%;">
      <!-- Controls Bar -->
      <div class="planner-header">
        <div class="calendar-controls">
          <button id="prevBtn" class="task-button">&larr; Previous</button>
          <button id="nextBtn" class="task-button">Next &rarr;</button>
          <button id="todayBtn" class="task-button">Today</button>
          <h2 id="currentMonthYear" style="margin-left: auto;"></h2>
        </div>
      </div>

      <!-- Days Container -->
      <div class="calendar-shell">
        <div class="weekday-header">
          <div>SUN</div><div>MON</div><div>TUE</div>
          <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
        </div>
        <div id="calendarGrid" class="calendar-days-grid"></div>
      </div>
    </main>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
