<h1>Welcome, {{ username }}</h1>

<ul>
    {% for task in tasks %}
        <li>{{ task[0] }}</li>
    {% endfor %}
</ul>

<h1>Planner</h1>

<form action="/planner/add" method="POST">

<input
type="text"
name="title"
placeholder="Task"
required>

<button>Add Task</button>

</form>

<div id="plannerTasks">

</div>
