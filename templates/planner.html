<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Task Organizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='planner.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Planner Logo">
            </a>
            <ul class="nav-links">
                <li><a href="/planner">Planner</a></li>
                <li><a href="/features">Features</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </div>

        <div class="nav-right">
            {% if session.get("user") %}
            <div class="account-menu">
                <button class="account-btn">
                    <span class="account-avatar">
                        {{ session["user"][0].upper() }}
                    </span>
                    <span class="account-name">
                        {{ session["user"] }}
                    </span>
                    ▾
                </button>
                <div class="account-dropdown">
                    <a href="/planner">Dashboard</a>
                    <a href="/logout">Logout</a>
                </div>
            </div>
            {% else %}
            <a href="/login" class="nav-login">Login</a>
            <a href="/signup" class="nav-signup">Get Started</a>
            {% endif %}
        </div>
    </nav>    

    <!-- TOPBAR -->
    <nav class="topbar">
        <h1>Intelligent Task Planner</h1>
    </nav>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <a href="/planner">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Contact</a>
    </div>

    <!-- MAIN PAGE CONTENT -->
    <div id="mainContent" class="main-content">
        
        <!-- HEADER / CONTROLS -->
        <header class="planner-header">
            <div class="search-wrapper">
                <button class="open-btn" onclick="toggleSidebar()">&#9776; Menu</button>
                <div class="search-bar">
                    <input id="search" type="search" placeholder="&#x1F50D; Start typing to search..." />
                </div>
                <button class="add-task-btn" onclick="openAddTaskModal()">+ Add Task</button>
                
            </div>
<div class="modal-overlay" id="task-modal">
  <div class="modal-content">
    <span class="close-btn" id="close-modal">&times;</span>
    <h2>Create New Task</h2>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Enter task name..." required>
      <button type="submit" class="save-btn">Save Task</button>
    </form>
  </div>
</div>
            <!-- Filter Tabs -->
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="today">Today</button>
                <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                <button class="filter-btn" data-filter="overdue">Overdue</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </header>

        <main class="container">
            <p class="date-display">Today's Date: <span id="current-date"></span></p>

            <section class="task-section">
                <h2>Today</h2>
                <div id="today-tasks" class="task-list">
                    <!-- JavaScript populates task cards here -->
                </div>
            </section>

            <section class="task-section">
                <h2>Upcoming</h2>
                <div id="upcoming-tasks" class="task-list">
                    <!-- JavaScript populates task cards here -->
                </div>
            </section>
        </main>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Inject current date
        const today = new Date().toLocaleDateString();
        document.getElementById("current-date").textContent = today;

        // Toggle Sidebar Function
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.getElementById("mainContent");
            
            sidebar.classList.toggle("open");
            mainContent.classList.toggle("shifted");
        }

        // Placeholder for Add Task Modal/Menu
        function openAddTaskModal() {
            console.log("Add task menu opened");
        }
    </script>
</body>
</html>
