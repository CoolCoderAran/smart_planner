<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Task Organizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='planner.css') }}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Planner Logo">
            </a>
            <ul class="nav-links">
                <li><a href="/planner">Planner</a></li>
                <li><a href="/features">Features</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </div>

        <div class="nav-right">
            {% if session.get("user") %}
            <div class="account-menu">
                <button class="account-btn">
                    <span class="account-avatar">
                        {{ session["user"][0].upper() }}
                    </span>
                    <span class="account-name">
                        {{ session["user"] }}
                    </span>
                    ▾
                </button>
                <div class="account-dropdown">
                    <a href="/planner">Dashboard</a>
                    <a href="/logout">Logout</a>
                </div>
            </div>
            {% else %}
            <a href="/login" class="nav-login">Login</a>
            <a href="/signup" class="nav-signup">Get Started</a>
            {% endif %}
        </div>
    </nav>    

    <!-- TOPBAR -->
    <nav class="topbar">
        <h1>Intelligent Task Planner</h1>
    </nav>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <a href="/planner">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Contact</a>
    </div>

    <!-- MAIN PAGE CONTENT -->
    <div id="mainContent" class="main-content">
        
        <!-- HEADER / CONTROLS -->
        <header class="planner-header">
            <div class="search-wrapper">
                <button class="open-btn" onclick="toggleSidebar()">&#9776; Menu</button>
                <div class="search-bar">
                    <input id="search" type="search" placeholder="&#x1F50D; Start typing to search..." />
                </div>
                <button class="add-task-btn" onclick="openModal()">+ Add Task</button>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="today">Today</button>
                <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                <button class="filter-btn" data-filter="overdue">Overdue</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </header>

       <main class="container">
    <p class="date-display">Today's Date: <span id="current-date"></span></p>

    <section class="task-section">
        <h2>Today</h2>
        <div id="today-tasks" class="task-list"></div>
    </section>

    <section class="task-section">
        <h2>Upcoming</h2>
        <div id="upcoming-tasks" class="task-list"></div>
    </section>

    <!-- NEW COMPLETED SECTION -->
    <section class="task-section">
        <h2>Completed</h2>
        <div id="completed-tasks" class="task-list"></div>
    </section>
</main>

    <!-- MODAL OVERLAY & WINDOW -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>Add New Task</h2>
            
            <form id="addTaskForm">
                <!-- 1. Task Name -->
                <div class="form-group">
                    <label for="modalTaskName">Task Name</label>
                    <input type="text" id="modalTaskName" placeholder="e.g., Read Chapter 4 & take notes" required />
                </div>

                <!-- 2. Subject / Course -->
                <div class="form-group">
                    <label for="modalSubject">Subject / Course</label>
                    <input type="text" id="modalSubject" placeholder="e.g., AP Computer Science / MATH 101" required />
                </div>

                <!-- Row 1: Due Date & Specific Deadline Time -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalDueDate">Due Date</label>
                        <input type="date" id="modalDueDate" required />
                    </div>

                    <div class="form-group">
                        <label for="modalDeadline">Deadline (Time)</label>
                        <input type="time" id="modalDeadline" required />
                    </div>
                </div>

                <!-- Row 2: Estimated Time & Priority -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalEstMinutes">Est. Minutes</label>
                        <input type="number" id="modalEstMinutes" min="5" step="5" placeholder="30" required />
                    </div>

                    <div class="form-group">
                        <label for="modalPriority">Priority</label>
                        <select id="modalPriority" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <!-- Form Action Buttons -->
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- INLINE JAVASCRIPT -->
   <script>
    // In-memory data store for tasks
    let tasks = [
        {
            id: 1,
            title: "Math Test",
            subject: "Mathematics",
            minutes: 45,
            due: "Today",
            priority: "high",
            completed: false
        },
        {
            id: 2,
            title: "Science Quiz",
            subject: "Science",
            minutes: 30,
            due: "Today",
            priority: "medium",
            completed: false
        },
        {
            id: 3,
            title: "History Essay",
            subject: "English",
            minutes: 60,
            due: "Monday",
            priority: "low",
            completed: false
        }
    ];

    let editingTaskId = null;

    // Display current date on page load
    const todayDate = new Date().toLocaleDateString();
    const currentDateEl = document.getElementById("current-date");
    if (currentDateEl) currentDateEl.textContent = todayDate;

    // Sidebar Controls
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");
        if (sidebar) sidebar.classList.toggle("open");
        if (mainContent) mainContent.classList.toggle("shifted");
    }

    // Modal Controls
    function openModal() {
        const modal = document.getElementById("taskModal");
        if (modal) modal.style.display = "flex";
    }

    function closeModal() {
        const modal = document.getElementById("taskModal");
        const form = document.getElementById("addTaskForm");
        if (modal) modal.style.display = "none";
        if (form) form.reset();
        editingTaskId = null;
    }

    // Close modal when clicking background overlay
    window.onclick = function(event) {
        const modal = document.getElementById("taskModal");
        if (event.target === modal) {
            closeModal();
        }
    };

    function getPriorityIcon(priority) {
        if (priority === "high") return "🔴";
        if (priority === "medium") return "🟡";
        return "🟢";
    }

    // FIX: Main render function defined in scope
    function renderTasks() {
        const todayContainer = document.getElementById("today-tasks");
        const upcomingContainer = document.getElementById("upcoming-tasks");
        const completedContainer = document.getElementById("completed-tasks");

        if (!todayContainer || !upcomingContainer) return;

        todayContainer.innerHTML = "";
        upcomingContainer.innerHTML = "";
        if (completedContainer) completedContainer.innerHTML = "";

        tasks.forEach(task => {
            const card = document.createElement("div");
            card.className = "task-card";

            card.innerHTML = `
                <div class="task-info">
                    <div class="task-title">
                        ${getPriorityIcon(task.priority)} ${task.title}
                    </div>
                    <div class="task-subject">${task.subject}</div>
                    <div class="task-meta">${task.minutes} min · Due ${task.due}</div>
                </div>
                <div class="task-actions">
                    <button class="task-button complete-button" onclick="completeTask(${task.id})">
                        ${task.completed ? "↩ Undo" : "✓ Complete"}
                    </button>
                    <button class="task-button edit-button" onclick="editTask(${task.id})">✏ Edit</button>
                    <button class="task-button delete-button" onclick="deleteTask(${task.id})">🗑 Delete</button>
                </div>
            `;

            if (task.completed) {
                if (completedContainer) completedContainer.appendChild(card);
            } else if (task.due === "Today") {
                todayContainer.appendChild(card);
            } else {
                upcomingContainer.appendChild(card);
            }
        });
    }

    // Task Action Handlers
    function completeTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            renderTasks();
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
    }

    function editTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        document.getElementById("modalTaskName").value = task.title;
        document.getElementById("modalSubject").value = task.subject;
        document.getElementById("modalEstMinutes").value = task.minutes;
        document.getElementById("modalPriority").value = task.priority;

        editingTaskId = id;
        openModal();
    }

    // Form Submit Event Handler
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("addTaskForm");
        if (form) {
            form.addEventListener("submit", function(event) {
                event.preventDefault();

                const title = document.getElementById("modalTaskName").value.trim();
                const subject = document.getElementById("modalSubject").value.trim();
                const minutes = parseInt(document.getElementById("modalEstMinutes").value, 10);
                const priority = document.getElementById("modalPriority").value;
                const dueDateInput = document.getElementById("modalDueDate").value;

                if (editingTaskId !== null) {
                    const task = tasks.find(t => t.id === editingTaskId);
                    if (task) {
                        task.title = title;
                        task.subject = subject;
                        task.minutes = minutes;
                        task.priority = priority;
                    }
                } else {
                    tasks.push({
                        id: Date.now(),
                        title: title,
                        subject: subject,
                        minutes: minutes,
                        priority: priority,
                        due: dueDateInput || "Today",
                        completed: false
                    });
                }

                renderTasks();
                closeModal();
            });
        }

        renderTasks();
    });
</script>
    <!-- Connected External JavaScript -->
    <script src="{{ url_for('static', filename='planner.js') }}"></script>
</body>
</html>
