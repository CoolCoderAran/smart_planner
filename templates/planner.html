<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligent Task Planner</title>
  <link rel="stylesheet" href="planner.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo"><img src="logo.png" alt="Logo" /></a>
      <ul class="nav-links">
        <li><a href="planner.html" class="active">Planner</a></li>
        <li><a href="calendar.html">Calendar</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <div class="account-menu">
        <button class="account-btn">
          <span class="account-avatar">G</span>
          GoodBoy57
        </button>
      </div>
    </div>
  </nav>

  <!-- App Main Wrapper -->
  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">Menu</div>
      <ul class="sidebar-nav">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="#">Today's Tasks</a></li>
        <li><a href="#">Upcoming</a></li>
        <li><a href="#">Completed</a></li>
      </ul>
    </aside>

    <!-- Main Content Content -->
    <main class="main-content">
      <header class="planner-header">
        <h1>Intelligent Task Planner</h1>
        <p class="header-subtitle">Manage your daily tasks and remain productive.</p>
        
        <div class="search-wrapper">
          <div class="search-bar">
            <input type="text" placeholder="Start typing to search..." />
          </div>
          <button class="add-task-btn">+ Add Task</button>
        </div>
      </header>

      <div class="planner-shell">
        <div class="filter-bar">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Today</button>
          <button class="filter-btn">Upcoming</button>
          <button class="filter-btn">Completed</button>
        </div>

        <section class="task-section">
          <h2>Today</h2>
          <div class="task-list">
            <p class="empty-state">No tasks scheduled for today!</p>
          </div>
        </section>

        <section class="task-section">
          <h2>Upcoming</h2>
          <div class="task-list">
            <p class="empty-state">No upcoming tasks!</p>
          </div>
        </section>

        <section class="task-section">
          <h2>Completed</h2>
          <div class="task-list">
            <p class="empty-state">No completed tasks yet!</p>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
