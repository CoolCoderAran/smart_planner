<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode • Smart Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='study.css') }}">
</head>
<body class="focus-body">

<nav class="navbar glass-card">
    <div class="nav-left">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Planner">
        </a>
        <ul class="nav-links">
            <li><a href="/planner">Planner</a></li>
            <li><a href="/calendar">Calendar</a></li>
            <li><a href="/study" class="active">Focus Mode</a></li>
        </ul>
    </div>
    <div class="nav-right">
        {% if session.get("user") %}
        <div class="account-menu">
            <button class="account-btn">
                <span class="account-avatar">{{ session["user"][0].upper() }}</span>
                <span>{{ session["user"] }}</span>
            </button>
            <div class="account-dropdown glass-card">
                <a href="/dashboard">Dashboard</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
        {% endif %}
    </div>
</nav>

<main class="study-container">
    <!-- TIMER GLASS CARD -->
    <section class="glass-card timer-card">
        <span id="phaseLabel" class="phase-badge">Focus Time</span>
        
        <div class="timer-ring">
            <div id="timerDisplay">25:00</div>
        </div>

        <div class="control-btn-group">
            <button class="glass-btn primary" onclick="startTimer()">Start</button>
            <button class="glass-btn" onclick="pauseTimer()">Pause</button>
            <button class="glass-btn" onclick="resumeTimer()">Resume</button>
            <button class="glass-btn danger" onclick="resetTimer()">Reset</button>
        </div>
    </section>

    <!-- CONFIGURATION PANEL -->
    <section class="glass-card config-card">
        <h2>Session Setup</h2>
        
        <div class="input-group">
            <label for="modeSelect">Timer Mode</label>
            <select id="modeSelect" class="glass-input">
                <option value="pomodoro">Pomodoro (25m / 5m)</option>
                <option value="deepwork">Deep Work (90m / 15m)</option>
                <option value="quickburst">Quick Burst (15m / 3m)</option>
                <option value="examcrunch">Exam Crunch (50m / 10m)</option>
                <option value="custom">Custom Mode</option>
            </select>
        </div>

        <div id="customSettings" class="custom-group" style="display:none;">
            <div class="input-group">
                <label for="customFocus">Focus (Mins)</label>
                <input type="number" id="customFocus" value="30" min="1" class="glass-input">
            </div>
            <div class="input-group">
                <label for="customBreak">Break (Mins)</label>
                <input type="number" id="customBreak" value="5" min="1" class="glass-input">
            </div>
        </div>

        <div class="input-group">
            <label for="taskSelect">Active Planner Task</label>
            <select id="taskSelect" class="glass-input">
                <option value="">-- General Focus Session --</option>
                {% for task in tasks %}
                <option value="{{ task.title }}">{{ task.title }} ({{ task.subject or 'General' }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="goal-wrapper">
            <div class="goal-text">
                <span>Daily Goal Progress</span>
                <span id="goalProgressText">0 / 120 mins</span>
            </div>
            <div class="goal-bar"><div id="goalFill"></div></div>
        </div>
    </section>
</main>

<!-- STATS GRID -->
<section class="stats-section">
    <div class="stats-grid">
        <div class="glass-card stat-card">
            <h3 id="todayMinutes">0</h3>
            <p>Today (Mins)</p>
        </div>
        <div class="glass-card stat-card">
            <h3 id="weeklyMinutes">0</h3>
            <p>This Week (Mins)</p>
        </div>
        <div class="glass-card stat-card">
            <h3 id="totalSessions">0</h3>
            <p>Completed Sessions</p>
        </div>
        <div class="glass-card stat-card">
            <h3 id="totalMinutes">0</h3>
            <p>Total Focus Mins</p>
        </div>
    </div>
</section>

<script src="{{ url_for('static', filename='study.js') }}"></script>
</body>
</html>
